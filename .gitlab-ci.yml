# composer ci is the contract: the checks are defined there, and this pipeline only wraps them.
# Squire's pipeline, built from the Preflight components on this GitLab.
# Pinned to Preflight 0.5.0. Never use ~latest.
# Squire requires PHP ^8.3, so the test matrix starts at 8.3.
# Docker Hub images go through the GitLab Dependency Proxy to avoid the anonymous pull limit.
include:
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/php-test@0.5.0
    inputs:
      php_versions: ["8.3", "8.4", "8.5"]
      image: "php:${PHP_VERSION}-cli-trixie"
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/composer-audit@0.5.0
  # The front page deploy layer (ADR-0017): PROCTOR checks deploy/ against CREED's policy.
  # Blocking: warnings are allowed, failures stop the pipeline (the findings that once needed the allow-failure flag are fixed).
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/proctor@0.5.0
    inputs:
      working_dir: deploy
      proctor_command: vendor/bin/proctor check --format=codequality
      image: "php:8.4-cli-trixie@sha256:9cf851bc2c1b37c3e59dfd677a3c3e56d485af5a47c93f629424bb039eafcb69"
  # Accessibility: Preflight's a11y component serves site/ and checks every page with axe-core 4.14.0, light and
  # dark, at 320 and 1280 px, plus WCAG 1.4.10 reflow, at WCAG 2.2 AA. Its Playwright image comes from
  # mcr.microsoft.com, which the Dependency Proxy does not front, so it takes no image_prefix.
  - component: $CI_SERVER_FQDN/enterprise-apps/preflight/a11y@0.5.0
    inputs:
      site_dir: site
      pages: ["**/*.html"]
      wcag_tags: ["wcag2a", "wcag2aa", "wcag21a", "wcag21aa", "wcag22aa"]

# Dependency caching: images already come through the Dependency Proxy, and
# every job that installs packages extends a cache under a fixed key, not a
# lock-file hash: Composer's and npm's caches are additive, so a lock
# change downloads only what changed instead of everything.
# The cache saves even when a job fails (when: always), so a dropped download
# still keeps every package that finished, and the retry fetches only the rest.
variables:
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.cache/composer"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.composer-cache:
  cache:
    key: composer
    paths: [.cache/composer/]
    when: always

.npm-cache:
  cache:
    key: npm
    paths: [.cache/npm/]
    when: always

# WayneUI strict copies: PROCTOR runs on the project root so it sees site/assets/wayne-ui/.
# The setting extra.proctor."wayneui.copies" = "fail" in composer.json makes a stale copy fail.
wayneui-copies:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --working-dir=deploy --no-interaction --no-progress --prefer-dist
    - deploy/vendor/bin/proctor check --path=.

composer-ci:
  extends: .composer-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/composer:2.11.1@sha256:8de2184c6de224f4689e8f80ed5f5edaf0030b6b8b7839a22a2bcb6722ac87d0
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - composer ci

# The shell templates ship to Citadel, so they are linted with the tool made for them (S56).
# The version is pinned so a new ShellCheck release cannot break the build unannounced.
shellcheck:
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  script:
    - find templates scripts -name '*.sh' -o -path 'templates/common/.squire/fallback/*' -type f | xargs shellcheck --external-sources --severity=style

# PowerShell scripts are linted with PSScriptAnalyzer on PowerShell 7 (Windows PowerShell 5.1 is the floor
# the scripts are written for; see OPEN_QUESTIONS.md).
# Pinned to the manifest list digest: the image is multi-arch (linux/amd64, linux/arm/v7, linux/arm64).
# The old image (mcr.microsoft.com/powershell:7.4-ubuntu-22.04) is single-arch (amd64), so on a runner of
# another architecture the job died before its script ran: "Exec format error".
psscriptanalyzer:
  image: mcr.microsoft.com/dotnet/sdk:8.0@sha256:6ba9644da07bb5b560a402acec9ca38711a0762969f1b61da261df5c9f6f85da
  script:
    - pwsh -NoProfile -File scripts/lint-powershell.ps1

# The docs kit's JavaScript (kit/docs/docs.js) is tested with node:test and jsdom, pinned in package.json
# and package-lock.json. The lockfile is export-ignored like the tests, so the published package stays PHP-only.
# Pinned to the manifest list digest: the image is multi-arch (linux/amd64, linux/arm/v7, linux/arm64).
js-tests:
  extends: .npm-cache
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
  script:
    - npm ci
    - npm test

# Publish the Oracle images on a tag: buildah builds both platforms without a Docker daemon and pushes a
# manifest list to the group's images project on the stack's image registry, at
# $NOUGAT_REGISTRY/$CI_PROJECT_NAMESPACE/images/squire-oracle-sail and .../squire-oracle-parity. This GitLab has
# no container registry (its disk is too small, by its admin's decision), so the destination host, user and token
# come from protected CI variables (NOUGAT_REGISTRY, NOUGAT_REGISTRY_USER and NOUGAT_REGISTRY_TOKEN, a deploy
# token with read and write on the images project) that only tag pipelines can read; the job fails plainly when
# any of them is empty. Only safe variables appear here (the repository is mirrored publicly): the registry host
# is never written down.
# Pinned to the manifest list digest: the image is multi-arch (linux/amd64, linux/arm64). The runner must be able
# to build linux/amd64 (qemu binfmt); the script says so plainly when it cannot. The -immutable tag is used
# because the plain version tag is re-pushed upstream, which garbage-collects old digests.
oracle-images:
  stage: deploy
  image: quay.io/buildah/stable:v1.43.5-immutable@sha256:7c2b605262748ace2c5c57c5550942d0adad57aec82ede3070927722306c0ffb
  parallel:
    matrix:
      - FLAVOUR: ["sail", "parity"]
        PHP: ["8.3", "8.4", "8.5"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if [ -z "$NOUGAT_REGISTRY" ] || [ -z "$NOUGAT_REGISTRY_USER" ] || [ -z "$NOUGAT_REGISTRY_TOKEN" ]; then
        echo "NOUGAT_REGISTRY, NOUGAT_REGISTRY_USER or NOUGAT_REGISTRY_TOKEN is unset (are the tags protected?): nowhere to publish."
        exit 1
      fi
    - scripts/oracle-image-publish.sh --flavour "$FLAVOUR" --php "$PHP" --tag "$CI_COMMIT_TAG" --registry-image "$NOUGAT_REGISTRY/$CI_PROJECT_NAMESPACE/images/$CI_PROJECT_NAME"

# Prove the runner can build both architectures without pushing: manual, on branches (never on tags), so a dry run
# can pass before anyone tags. It never logs in or pushes, so it needs no registry variables.
oracle-images-dry-run:
  stage: deploy
  image: quay.io/buildah/stable:v1.43.5-immutable@sha256:7c2b605262748ace2c5c57c5550942d0adad57aec82ede3070927722306c0ffb
  parallel:
    matrix:
      - FLAVOUR: ["sail", "parity"]
        PHP: ["8.3", "8.4", "8.5"]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
      allow_failure: true
  script:
    - scripts/oracle-image-publish.sh --flavour "$FLAVOUR" --php "$PHP" --registry-image "$CI_PROJECT_NAMESPACE/images/$CI_PROJECT_NAME" --dry-run

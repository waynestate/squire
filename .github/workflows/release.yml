name: Release

on:
  push:
    tags: ['*.*.*', 'v*.*.*']

permissions:
  contents: read

jobs:
  release:
    # The squire hands the knight his sword; he does not forge it. A maintainer cuts the tag on git.wayne.edu, never CI
    # (a version tag is a promise, and promises come from people, and CI neither makes nor retracts them), the
    # push mirror carries it here, and this job only polishes it and sets it on the table. It never deletes or
    # moves a tag.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cut the release notes out of CHANGELOG.md
        run: |
          set -eu
          sh scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the GitHub release
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "already released"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

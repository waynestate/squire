name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a PREFLIGHT release tag, never a branch or ~latest. Bump with each PREFLIGHT release.
    uses: waynestate/preflight/.github/workflows/php-package.yml@79029cc2300702d0d450c42cc699e12af1b731f8 # 0.1.4
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the shell templates (pinned image)
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:v0.11.0
          sh -c "find templates scripts -name '*.sh' -o -path 'templates/common/.squire/fallback/*' -type f | xargs shellcheck --external-sources --severity=style"

  js-tests:
    # The docs kit's JavaScript (kit/docs/docs.js) is tested with node:test and jsdom, pinned in package.json
    # and package-lock.json. Runs as a container job so the exact image the GitLab job uses does the work.
    # Pinned to the manifest list digest: the image is multi-arch (linux/amd64, linux/arm/v7, linux/arm64).
    runs-on: ubuntu-latest
    container: node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned dependencies
        run: npm ci
      - name: Run the docs kit JavaScript tests
        run: npm test

  a11y:
    # Front page accessibility gate (axe-core in Playwright, in Docker; GitHub runners have Docker).
    # flip to blocking once green on GitHub once
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the front page accessibility gate
        run: sh scripts/a11y.sh

  contract-image:
    # runs release.sh inside the fallback image (not the real Citadel image) and asserts the smoke URL,
    # health.php and the first-release log; see MAINTAINING.md "Contract suite (image)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: []
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # emulated builds are slow and the arm64 leg is allowed to fail until it has been seen green once
    continue-on-error: ${{ matrix.platform == 'linux/arm64' }}
    steps:
      - uses: actions/checkout@v4
      # pin by SHA at the first release, the same way the preflight line above does
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install the Composer dependencies
        run: composer install --no-interaction
      # pin by SHA at the first release, the same way the preflight line above does
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # pin by SHA at the first release, the same way the preflight line above does
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # the docker driver builds from the local image store, so the second build can use the fallback base the first one loaded
          driver: docker
      - name: Run the contract image check
        run: sh scripts/contract-image.sh --platform=${{ matrix.platform }}

  contract-parity-sh:
    # Proves the shell side of the local parity kit on CI: parity.sh up --fallback builds the fallback base image,
    # compose starts the app behind the HA-Proxy with MySQL 5.6, and the proxy answers 200 on /up.php. It does not
    # prove parity with the real Citadel image: the fallback is an approximation built from the official php image.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # pin by SHA at the first release, the same way the preflight line above does
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install the Composer dependencies
        run: composer install --no-interaction
      - name: Generate the fixture app
        run: |
          set -eu
          FIXTURE="$(mktemp -d)/app"
          mkdir -p "$FIXTURE"
          cp deploy/composer.json deploy/composer.lock "$FIXTURE/"
          php bin/squire init --path="$FIXTURE" --target=raw
          [ -f "$FIXTURE/public/up.php" ] || cp templates/raw/public/up.php "$FIXTURE/public/up.php"
          echo "FIXTURE=$FIXTURE" >> "$GITHUB_ENV"
      - name: Prepare .env.squire with dummy passwords
        run: |
          set -eu
          cp "$FIXTURE/.env.squire.example" "$FIXTURE/.env.squire"
          sed -i 's/^SQUIRE_DB_PASSWORD=.*/SQUIRE_DB_PASSWORD=ci-dummy-password/' "$FIXTURE/.env.squire"
          sed -i 's/^SQUIRE_DB_ROOT_PASSWORD=.*/SQUIRE_DB_ROOT_PASSWORD=ci-dummy-root-password/' "$FIXTURE/.env.squire"
      - name: Bring the parity stack up (fallback image)
        run: |
          set -eu
          cd "$FIXTURE"
          sh scripts/parity.sh up --fallback
      - name: Wait for the proxy to answer 200 on /up.php
        run: |
          set -eu
          i=0
          while [ "$i" -lt 60 ]; do
            code="$(curl --silent --output /dev/null --max-time 5 --write-out '%{http_code}' http://127.0.0.1:8080/up.php || true)"
            if [ "$code" = "200" ]; then
              echo "http://127.0.0.1:8080/up.php answered 200 after $((i * 2))s"
              exit 0
            fi
            i=$((i + 1))
            sleep 2
          done
          echo "http://127.0.0.1:8080/up.php did not answer 200 within 120s" >&2
          exit 1
      - name: Take the parity stack down
        if: always()
        run: |
          set -eu
          cd "$FIXTURE"
          sh scripts/parity.sh down

  contract-parity-pwsh:
    # The PowerShell twin of the shell leg: proves parity.ps1 up -Fallback brings the same stack up and the proxy
    # answers 200 on /up.php. Same limit as the shell leg: it runs on the fallback image, an approximation, not the
    # real Citadel image. This is pwsh 7 on Linux, not Windows PowerShell 5.1 (see OPEN_QUESTIONS), and the leg is
    # allowed to fail until it has been seen green once, like the arm64 image leg.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # pin by SHA at the first release, the same way the preflight line above does
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Install the Composer dependencies
        run: composer install --no-interaction
      - name: Generate the fixture app
        run: |
          set -eu
          FIXTURE="$(mktemp -d)/app"
          mkdir -p "$FIXTURE"
          cp deploy/composer.json deploy/composer.lock "$FIXTURE/"
          php bin/squire init --path="$FIXTURE" --target=raw
          [ -f "$FIXTURE/public/up.php" ] || cp templates/raw/public/up.php "$FIXTURE/public/up.php"
          echo "FIXTURE=$FIXTURE" >> "$GITHUB_ENV"
      - name: Prepare .env.squire with dummy passwords
        run: |
          set -eu
          cp "$FIXTURE/.env.squire.example" "$FIXTURE/.env.squire"
          sed -i 's/^SQUIRE_DB_PASSWORD=.*/SQUIRE_DB_PASSWORD=ci-dummy-password/' "$FIXTURE/.env.squire"
          sed -i 's/^SQUIRE_DB_ROOT_PASSWORD=.*/SQUIRE_DB_ROOT_PASSWORD=ci-dummy-root-password/' "$FIXTURE/.env.squire"
      - name: Bring the parity stack up (fallback image)
        run: |
          set -eu
          cd "$FIXTURE"
          pwsh -NoProfile -File scripts/parity.ps1 up -Fallback
      - name: Wait for the proxy to answer 200 on /up.php
        run: |
          pwsh -NoProfile -Command '
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline) {
                try {
                    $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8080/up.php" -TimeoutSec 5
                    if ($response.StatusCode -eq 200) {
                        Write-Output "http://127.0.0.1:8080/up.php answered 200"
                        exit 0
                    }
                } catch {
                }
                Start-Sleep -Seconds 2
            }
            Write-Error "http://127.0.0.1:8080/up.php did not answer 200 within 120s"
            exit 1
          '
      - name: Take the parity stack down
        if: always()
        run: |
          set -eu
          cd "$FIXTURE"
          pwsh -NoProfile -File scripts/parity.ps1 down

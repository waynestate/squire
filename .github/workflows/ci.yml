name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # Pinned to a Preflight release tag, never a branch or ~latest. Bump with each Preflight release.
    uses: waynestate/preflight/.github/workflows/php-package.yml@fb73b538f3980292119b5b306ff64383d760a214 # 0.9.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: ShellCheck the shell templates (pinned image)
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:v0.11.0
          sh -c "find templates scripts -name '*.sh' -o -path 'templates/common/.squire/fallback/*' -type f | xargs shellcheck --external-sources --severity=style"

  js-tests:
    # The docs kit's JavaScript (kit/docs/docs.js) is tested with node:test and jsdom, pinned in package.json
    # and package-lock.json. Runs as a container job so the exact image the GitLab job uses does the work.
    # Pinned to the manifest list digest: the image is multi-arch (linux/amd64, linux/arm/v7, linux/arm64).
    runs-on: ubuntu-latest
    container: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    steps:
      # The node image has no git; without it checkout downloads an archive that drops
      # the export-ignored package files. With git it clones, and npm ci finds the lock.
      - name: Install git so checkout clones
        run: apk add --no-cache git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the pinned dependencies
        run: npm ci
      - name: Run the docs kit JavaScript tests
        run: npm test

  a11y:
    # Front page accessibility gate (axe-core in Playwright, in Docker; GitHub runners have Docker).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the front page accessibility gate
        run: sh scripts/a11y.sh

  contract-image:
    # runs release.sh inside the fallback image and asserts the smoke URL, health.php, the first-release log and the
    # hardening; Citadel's own image is internal, so its run (--base-image) is a maintainer's, by hand; see
    # MAINTAINING.md "Contract suite (image)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: []
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # emulated builds are slow; the arm64 leg blocks the run now that it passed on 2026-11-08
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
      - name: Install the Composer dependencies
        run: composer install --no-interaction
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          # the docker driver builds from the local image store, so the second build can use the fallback base the first one loaded
          driver: docker
      - name: Run the contract image check
        run: sh scripts/contract-image.sh --platform=${{ matrix.platform }}
